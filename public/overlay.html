html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
  font-family: 'Disket Mono', 'Segoe UI', Arial, sans-serif;
}
#ticker-bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  height: 56px;
  overflow: hidden;
  background: linear-gradient(90deg, rgba(0,0,0,0.85), rgba(6,20,6,0.85), rgba(0,0,0,0.85));
  border-top: 3px solid #00bd00;
  box-shadow: 0 -2px 14px rgba(0, 189, 0, 0.35);
}
#ticker-track {
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
  display: flex;
  align-items: center;
  white-space: nowrap;
  will-change: transform;
}
#ticker-track .item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 40px;
}
.tag {
  font-size: 20px;
}
#ticker-track .item .txt {
  font-family: 'Druk Wide Bold', 'Arial Black', 'Segoe UI', Arial, sans-serif;
  font-weight: 700;
  font-size: 22px;
  color: #ffffff;
  text-shadow: 0 0 8px rgba(0, 189, 0, 0.65);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.asso-logo {
  height: 46px;
  max-width: 180px;
  width: auto;
  object-fit: contain;
  background: #ffffff;
  border-radius: 4px;
  padding: 2px 6px;
}
.asso-name {
  font-family: 'Disket Mono', 'Segoe UI', Arial, sans-serif;
  font-weight: bold;
  font-size: 19px;
  color: #d9ffd9;
}
  .item.priority {
    background: rgba(0, 189, 0, 0.18);
    border-radius: 6px;
  }
  .item.priority.donation .txt {
    color: #FFD700;
    font-weight: 800;
    text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
  }
  .item.priority.pin .txt {
    color: #ffffff;
    font-weight: 800;
  }
  .item.priority .tag {
    font-size: 22px;
  }
  .item.donation-counter {
    gap: 10px;
  }
  .item.donation-counter .tag {
    font-size: 20px;
  }
  .item.donation-counter iframe {
    border: none;
    background: transparent;
    display: block;
  }
</style>
</head>
<body>
<div id="ticker-bar">
  <div id="ticker-track"></div>
</div>
<script>
const track = document.getElementById('ticker-track');
  const bar = document.getElementById('ticker-bar');
  let items = [];
  let currentAnim = null;

  async function fetchItems() {
    try {
      const res = await fetch('/info');
      const data = await res.json();
      if (data && Array.isArray(data.items) && data.items.length) {
        items = data.items;
      }
    } catch (e) {
      console.error('Erreur /info', e);
    }
  }

  function waitForImages(container) {
    const imgs = Array.from(container.querySelectorAll('img'));
    if (!imgs.length) return Promise.resolve();
    return Promise.all(imgs.map((img) => {
      if (img.complete) return Promise.resolve();
      return new Promise((resolve) => {
        img.addEventListener('load', resolve, { once: true });
        img.addEventListener('error', resolve, { once: true });
      });
    }));
  }

  function buildItemEl(item) {
    if (item.live) return buildPriorityItemEl(item);
    const wrap = document.createElement('div');
    wrap.className = 'item';
    if (item.type === 'asso') {
      const img = document.createElement('img');
      img.className = 'asso-logo';
      img.src = item.logo;
      img.alt = item.text;
      const name = document.createElement('span');
      name.className = 'asso-name';
      name.textContent = item.text;
      wrap.appendChild(img);
      wrap.appendChild(name);
    } else if (item.type === 'donation-counter') {
      const label = document.createElement('span');
      label.className = 'tag';
      label.textContent = item.text || '';
      const frame = document.createElement('iframe');
      frame.src = item.url;
      frame.width = item.width || 260;
      frame.height = 56;
      frame.setAttribute('scrolling', 'no');
      frame.setAttribute('frameborder', '0');
      wrap.classList.add('donation-counter');
      wrap.appendChild(label);
      wrap.appendChild(frame);
    } else {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = '\u{1F7E2}';
      const txt = document.createElement('span');
      txt.className = 'txt';
      txt.textContent = item.text;
      wrap.appendChild(tag);
      wrap.appendChild(txt);
    }
    return wrap;
  }

  async function buildTrack() {
    if (currentAnim) {
      currentAnim.cancel();
      currentAnim = null;
    }
    track.innerHTML = '';
    track.style.transform = 'translateX(0px)';
    if (!items.length) return;

    items.forEach((item) => track.appendChild(buildItemEl(item)));
    await waitForImages(track);

    const singleWidth = track.scrollWidth;

    items.forEach((item) => track.appendChild(buildItemEl(item)));

    const speed = 90;
    const duration = Math.max(4000, (singleWidth / speed) * 1000);

    currentAnim = track.animate(
      [
        { transform: 'translateX(0px)' },
        { transform: `translateX(-${singleWidth}px)` },
        ],
      { duration, easing: 'linear', iterations: Infinity }
      );
  }

  function buildPriorityItemEl(msg) {
    const wrap = document.createElement('div');
    wrap.className = 'item priority';
    if (msg.kind === 'donation') {
      wrap.classList.add('donation');
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = '\u{1F49A}';
      const txt = document.createElement('span');
      txt.className = 'txt';
      const amount = msg.amount ? ' (' + msg.amount + ')' : '';
      const quote = msg.text ? ' : "' + msg.text + '"' : '';
      txt.textContent = 'Don de ' + msg.author + amount + quote;
      wrap.appendChild(tag);
      wrap.appendChild(txt);
    } else {
      wrap.classList.add('pin');
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = '\u{1F4CC}';
      const txt = document.createElement('span');
      txt.className = 'txt';
      const author = msg.author ? msg.author + ' : ' : '';
      txt.textContent = author + msg.text;
      wrap.appendChild(tag);
      wrap.appendChild(txt);
    }
    return wrap;
  }

  async function handleLiveMessage(msg) {
    items = [Object.assign({}, msg, { live: true }), ...items];
    await buildTrack();
  }

  function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(proto + '//' + location.host + '/ws');
    ws.addEventListener('message', (evt) => {
      try {
        const msg = JSON.parse(evt.data);
        handleLiveMessage(msg);
      } catch (e) {
        console.error('Message WS invalide', e);
      }
    });
    ws.addEventListener('close', () => setTimeout(connectWS, 3000));
    ws.addEventListener('error', () => ws.close());
  }

  async function init() {
    connectWS();
    await fetchItems();
    await buildTrack();
    setInterval(async () => {
      await fetchItems();
      await buildTrack();
    }, 120000);
  }

  init();
</script>
</body>
</html>
